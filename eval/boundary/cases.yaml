# Набор «граница GREEN»: риск записан словами, которых нет ни в
# грамматиках карточки, ни в тревожных формулировках правил (red_flags), ни в подсказках поиска.
# Тревожные формулировки под эти случаи НЕ расширялись — набор проверяет архитектуру, а не словарь.
#
# Каждый случай — чистый пакет (извещение, контракт, ТЗ) с одной вставкой:
#   section8 — пункты в разделе 8 «Прочие условия» контракта;
#   replace  — замена пунктов контракта {номер: текст};
#   appendix — отдельный файл «Приложение № 3 к контракту»;
#   table    — строки таблицы «условие | значение» в разделе 8.
# self_contained — риск понятен из одного предложения; false — смысл распределён по пунктам
# (ссылка «в пункте 9.7», «срок, указанный в настоящем пункте»).
# present: true — реальный риск по правилу `rule`; false — законная формулировка (контроль ложных
# тревог: такой пакет обязан остаться зелёным).

cases:
  # ───────────── TRM-01: односторонний отказ шире закона ─────────────
  - {id: B01, rule: TRM-01, technique: синоним, self_contained: true,
     section8: ["Заказчик может прекратить действие Контракта, уведомив Поставщика, без указания мотивов."]}
  - {id: B02, rule: TRM-01, technique: юридическая конструкция, self_contained: true,
     section8: ["Контракт может быть прекращён по инициативе Заказчика по его усмотрению."]}
  - {id: B03, rule: TRM-01, technique: косвенное описание, self_contained: true,
     section8: ["Заказчик сохраняет за собой возможность в любой момент прекратить получение Товара, при этом Контракт считается исполненным в части фактически поставленного Товара."]}
  - {id: B04, rule: TRM-01, technique: двойное отрицание, self_contained: true,
     section8: ["Ничто в Контракте не препятствует Заказчику выйти из Контракта во всякое время, не обосновывая такое решение."]}
  - {id: B05, rule: TRM-01, technique: порядок слов, self_contained: true,
     section8: ["Без объяснения причин и в любой момент от исполнения Контракта отказаться Заказчик вправе."]}
  - {id: B06, rule: TRM-01, technique: через исключение, self_contained: true,
     section8: ["Односторонний отказ от исполнения Контракта допускается в случаях, предусмотренных частью 9 статьи 95 Закона, а также в иных случаях по решению Заказчика."]}
  - {id: B07, rule: TRM-01, technique: через условие, self_contained: true,
     section8: ["В случае утраты Заказчиком потребности в Товаре Заказчик направляет Поставщику уведомление, и Контракт прекращается с даты его получения."]}
  - {id: B08, rule: TRM-01, technique: ссылка на другой пункт, self_contained: true,
     section8: ["Заказчик вправе принять решение об одностороннем отказе от исполнения Контракта по основаниям, указанным в пункте 8.2.",
                "Основанием для одностороннего отказа является любое отступление Поставщика от условий Контракта, в том числе однократное и незначительное."]}
  - {id: B09, rule: TRM-01, technique: таблица, self_contained: true,
     table: ["Основания расторжения | по решению Заказчика без ограничений"]}
  - {id: B10, rule: TRM-01, technique: приложение, self_contained: true,
     appendix: ["Заказчик вправе в одностороннем внесудебном порядке прекратить отношения по Контракту по собственному решению."]}
  - {id: B11, rule: TRM-01, technique: через право выбора, self_contained: true,
     section8: ["Заказчик по своему выбору либо принимает Товар, либо отказывается от Контракта без компенсации Поставщику."]}
  - {id: B12, rule: TRM-01, technique: обязанность вместо права, self_contained: true,
     section8: ["Поставщик обязан принять отказ Заказчика от Контракта, заявленный в любое время."]}

  # ───────────── LIA-03: пеня сверх 1/300 ключевой ставки ─────────────
  - {id: B13, rule: LIA-03, technique: синоним, self_contained: true,
     section8: ["За каждые сутки задержки поставки Поставщик выплачивает неустойку в размере одного процента от стоимости Контракта."]}
  - {id: B14, rule: LIA-03, technique: косвенное описание, self_contained: true,
     section8: ["Размер ответственности Поставщика за нарушение сроков составляет 0,5 процента цены Контракта, исчисляемых ежедневно."]}
  - {id: B15, rule: LIA-03, technique: без ключевых слов, self_contained: true,
     section8: ["Сумма, удерживаемая Заказчиком при оплате, увеличивается на 2 000 (две тысячи) рублей за каждый календарный день нарушения срока поставки."]}
  - {id: B16, rule: LIA-03, technique: таблица, self_contained: true,
     table: ["Нарушение срока поставки | 0,3 % цены Контракта за день"]}
  - {id: B17, rule: LIA-03, technique: примечание, self_contained: true,
     section8: ["Примечание: при исчислении пени за просрочку применяется ставка 1/100 цены Контракта."]}
  - {id: B18, rule: LIA-03, technique: ссылка на другой пункт, self_contained: false,
     section8: ["Пеня за просрочку исполнения обязательств Поставщиком начисляется в размере, установленном пунктом 8.2.",
                "Размер, указанный в настоящем пункте, — одна десятая процента от цены Контракта за каждые сутки."]}
  - {id: B19, rule: LIA-03, technique: годовая ставка, self_contained: true,
     section8: ["За период просрочки Поставщик уплачивает Заказчику проценты по ставке 365 процентов годовых от цены Контракта."]}
  - {id: B20, rule: LIA-03, technique: приложение, self_contained: true,
     appendix: ["За просрочку поставки Поставщик уплачивает 1 % цены Контракта за каждый день."]}

  # ───────────── LIA-01: штрафы сверх ПП № 1042 ─────────────
  - {id: B21, rule: LIA-01, technique: прямое значение, self_contained: true,
     section8: ["За каждый факт ненадлежащего исполнения обязательств Поставщик уплачивает штраф в размере 20 процентов цены Контракта независимо от цены Контракта."]}
  - {id: B22, rule: LIA-01, technique: синоним, self_contained: true,
     section8: ["Поставщик уплачивает Заказчику денежную санкцию в размере 25 % цены Контракта за любое нарушение условий Контракта."]}
  - {id: B23, rule: LIA-01, technique: через удержание, self_contained: true,
     section8: ["При выявлении любого недостатка Товара Заказчик удерживает из суммы оплаты 15 % цены Контракта."]}
  - {id: B24, rule: LIA-01, technique: двойное отрицание, self_contained: true,
     section8: ["Не освобождается от уплаты штрафа в размере половины цены Контракта Поставщик, не обеспечивший своевременную замену Товара."]}
  - {id: B25, rule: LIA-01, technique: обязанность, self_contained: true,
     section8: ["Поставщик обязуется возместить Заказчику фиксированную сумму в размере 30 % цены Контракта при каждом случае отступления от требований к упаковке."]}
  - {id: B26, rule: LIA-01, technique: таблица, self_contained: true,
     table: ["Нарушение требований к маркировке | 40 % цены Контракта за каждый случай"]}

  # ───────────── LIA-02: ответственности заказчика нет ─────────────
  - {id: B27, rule: LIA-02, technique: через исключение, self_contained: true,
     section8: ["Стороны несут ответственность в соответствии с законодательством, за исключением ответственности Заказчика за просрочку оплаты, которая к Заказчику не применяется."]}
  - {id: B28, rule: LIA-02, technique: косвенное описание, self_contained: true,
     section8: ["Задержка оплаты по причинам, связанным с бюджетным финансированием, не влечёт для Заказчика никаких последствий."]}
  - {id: B29, rule: LIA-02, technique: через право поставщика, self_contained: true,
     section8: ["Требования Поставщика об уплате пени за нарушение сроков оплаты удовлетворению не подлежат."]}
  - {id: B30, rule: LIA-02, technique: через условие, self_contained: true,
     section8: ["Заказчик уплачивает пеню за просрочку оплаты только в случае, если Поставщик докажет умысел должностных лиц Заказчика."]}
  - {id: B31, rule: LIA-02, technique: двойное отрицание, self_contained: true,
     section8: ["Ни одно положение Контракта не может толковаться как устанавливающее обязанность Заказчика уплачивать неустойку."]}

  # ───────────── TRM-02: решение об отказе без срока на устранение ─────────────
  - {id: B32, rule: TRM-02, technique: прямое значение, self_contained: true,
     section8: ["Решение об одностороннем отказе вступает в силу в день его направления Поставщику."]}
  - {id: B33, rule: TRM-02, technique: через запрет, self_contained: true,
     section8: ["Поставщик не вправе ссылаться на устранение нарушения после получения уведомления об отказе."]}
  - {id: B34, rule: TRM-02, technique: через исключение, self_contained: true,
     section8: ["Устранение нарушения после принятия решения не является основанием для его отмены."]}
  - {id: B35, rule: TRM-02, technique: короткий срок, self_contained: true,
     section8: ["Решение об отказе от Контракта вступает в силу через 3 (три) дня с даты размещения в единой информационной системе."]}

  # ───────────── PAY-01: срок оплаты (значение) ─────────────
  - {id: B36, rule: PAY-01, technique: синоним срока, self_contained: true,
     section8: ["Расчёт с Поставщиком за второй этап осуществляется по истечении 45 рабочих дней с даты приемки."]}
  - {id: B37, rule: PAY-01, technique: порядковое число, self_contained: true,
     section8: ["Денежные средства за второй этап перечисляются Поставщику на 46-й рабочий день после подписания документа о приемке."]}
  - {id: B38, rule: PAY-01, technique: через условие, self_contained: true,
     section8: ["Оплата второго этапа производится в течение 7 рабочих дней с даты поступления средств из бюджета, но не ранее 60 дней с даты приемки."]}
  - {id: B39, rule: PAY-01, technique: другая единица, self_contained: true,
     table: ["Срок оплаты второго этапа | два месяца с даты приемки"]}
  - {id: B40, rule: PAY-01, technique: ссылка на другой пункт, self_contained: false,
     section8: ["Оплата второго этапа производится в срок, указанный в пункте 8.2.",
                "Срок, указанный в настоящем пункте, составляет тридцать пять рабочих дней с даты приемки."]}
  - {id: B41, rule: PAY-01, technique: без срока, self_contained: true,
     section8: ["Оплата второго этапа производится после получения Заказчиком лимитов бюджетных обязательств на очередной финансовый год."]}

  # ───────────── ACC-01: приёмка дольше 20 рабочих дней ─────────────
  - {id: B42, rule: ACC-01, technique: «не ранее чем через», self_contained: true,
     section8: ["Документ о приемке второй партии подписывается Заказчиком не ранее чем через 25 рабочих дней с даты поставки."]}
  - {id: B43, rule: ACC-01, technique: синоним, self_contained: true,
     section8: ["Срок проверки соответствия второй партии Товара условиям Контракта составляет один месяц."]}
  - {id: B44, rule: ACC-01, technique: распределение по пунктам, self_contained: false,
     section8: ["Приемка второй партии осуществляется по результатам экспертизы.",
                "Экспертиза второй партии проводится в течение сорока рабочих дней."]}

  # ───────────── SEC-01, TERM-01: значения словами и в других единицах ─────────────
  - {id: B45, rule: SEC-01, technique: значение словами, self_contained: true,
     replace: {"5.1": "Обеспечение исполнения контракта устанавливается в размере половины цены контракта."}}
  - {id: B46, rule: TERM-01, technique: без числа, self_contained: true,
     replace: {"3.1": "Товар поставляется на следующий день после заключения контракта."}}
  - {id: B47, rule: TERM-01, technique: другая единица, self_contained: true,
     replace: {"3.1": "Поставка осуществляется в течение 24 часов с момента заключения контракта."}}

  # ───────────── ACC-02, VOL-02 (жёлтые) ─────────────
  - {id: B48, rule: ACC-02, technique: косвенное описание, self_contained: true,
     section8: ["Расходы на испытания Товара в аккредитованной лаборатории относятся на Поставщика."]}
  - {id: B49, rule: VOL-02, technique: обязанность, self_contained: true,
     section8: ["Поставщик своими силами поднимает Товар на любой этаж здания и собирает мебель без дополнительной оплаты."]}
  - {id: B50, rule: LIA-03, technique: распределение и таблица, self_contained: true,
     section8: ["Ставка пени за просрочку поставки приведена в таблице ниже."],
     table: ["Ставка пени | 0,2 % цены Контракта за каждые сутки"]}

  # ───────────── чистые формулировки (контроль ложных тревог) ─────────────
  - {id: C01, rule: TRM-01, technique: ссылка на закон, present: false,
     section8: ["Заказчик вправе принять решение об одностороннем отказе от исполнения Контракта в порядке и по основаниям, предусмотренным частями 8–26 статьи 95 Закона."]}
  - {id: C02, rule: LIA-03, technique: полная формула 1/300, present: false,
     section8: ["Пеня начисляется за каждый день просрочки в размере одной трехсотой действующей на дату уплаты пени ключевой ставки Центрального банка Российской Федерации от цены Контракта, уменьшенной на сумму исполненных обязательств."]}
  - {id: C03, rule: LIA-01, technique: ссылка на ПП 1042, present: false,
     section8: ["Размер штрафа за ненадлежащее исполнение обязательств определяется в порядке, установленном постановлением Правительства Российской Федерации от 30.08.2017 № 1042."]}
  - {id: C04, rule: TRM-02, technique: 10 дней, present: false,
     section8: ["Решение Заказчика об одностороннем отказе вступает в силу и Контракт считается расторгнутым через 10 дней с даты надлежащего уведомления Поставщика."]}
  - {id: C05, rule: TRM-01, technique: отрицание, present: false,
     section8: ["Заказчик не вправе отказаться от исполнения Контракта без оснований, предусмотренных законом."]}
  - {id: C06, rule: TRM-01, technique: право поставщика, present: false,
     section8: ["Поставщик вправе принять решение об одностороннем отказе от исполнения Контракта в случаях, предусмотренных гражданским законодательством."]}
  - {id: C07, rule: PAY-01, technique: «не позднее», present: false,
     section8: ["Оплата второго этапа производится не позднее 7 рабочих дней с даты подписания документа о приемке."]}
  - {id: C08, rule: ACC-02, technique: расходы заказчика, present: false,
     section8: ["Расходы на проведение экспертизы Товара несет Заказчик."]}
  - {id: C09, rule: PAY-01, technique: счёт и оплата, present: false,
     section8: ["Счет выставляется Поставщиком в течение 3 рабочих дней с даты поставки; оплата производится в течение 7 рабочих дней с даты приемки."]}
  - {id: C10, rule: LIA-02, technique: пеня заказчика, present: false,
     section8: ["Заказчик уплачивает Поставщику пеню за каждый день просрочки исполнения обязательства по оплате."]}
  - {id: C11, rule: PAY-01, technique: таблица, present: false,
     table: ["Срок оплаты второго этапа | 7 рабочих дней с даты приемки"]}
  - {id: C12, rule: ACC-01, technique: экспертиза своими силами, present: false,
     section8: ["Экспертиза проводится Заказчиком своими силами в пределах срока приемки."]}
  - {id: C13, rule: LIA-01, technique: освобождение поставщика, present: false,
     section8: ["Поставщик освобождается от уплаты неустойки, если просрочка произошла по вине Заказчика."]}
  - {id: C14, rule: LIA-03, technique: непреодолимая сила, present: false,
     section8: ["Неустойка не начисляется, если просрочка вызвана обстоятельствами непреодолимой силы."]}
  - {id: C15, rule: TERM-01, technique: гарантийный срок, present: false,
     section8: ["Гарантийный срок на Товар составляет 12 месяцев с даты подписания документа о приемке."]}
