    status: draft

  - id: CON-07
    title: Одно условие указано в документе по-разному
    category: consistency
    law: ["44-ФЗ", "223-ФЗ"]
    applies_to: [notice, contract]
    type: internal_consistency
    facts: [quantity_total, nmck_rub, contract_security_percent, bid_security_percent, advance_percent]
    severity: yellow
    message: "В документе «{document}» {field} указано по-разному: {first} и {second}."
    why_risk: "Какое из значений действует, решит заказчик при исполнении — обычно в свою пользу. Разное количество в разных пунктах — повод для претензий за недопоставку, разные проценты обеспечения или аванса — риск внести не ту сумму."
    recommendation: "Сверить пункты по цитатам. Если это не партии или этапы — направить запрос на разъяснение до окончания подачи заявок."
    clarification: "В документации одно и то же условие указано по-разному ({quote}). Просим указать верное значение и внести изменения в документацию."
    legal_basis:
      - {act: "44-ФЗ", ref: "ч. 5 ст. 42", note: "запрос о даче разъяснений положений извещения", edition_checked: "2026-10-08"}
      - {act: "223-ФЗ", ref: "ч. 3 ст. 3.2", note: "запрос о даче разъяснений положений извещения и документации", edition_checked: "2026-10-08"}
    status: draft

  - id: CON-03
    title: Скрытый текст в документе
    category: consistency
    law: ["44-ФЗ", "223-ФЗ"]
    applies_to: [notice, contract, spec, bid_requirements, nmck, other]
    type: signal
    signal: hidden_text
    severity: yellow
    message: "В документе есть текст, невидимый при просмотре: {quote}"
    why_risk: "Скрытый текст (белым по белому, крошечным шрифтом, за полями) юридически остаётся частью документа: в нём могут быть условия, которые участник не увидит. Бывает и текст-указание для автоматических систем проверки — чтобы они «не заметили» риски."
    recommendation: "Прочитать скрытый текст по подсветке. Если там условия контракта — направить запрос на разъяснение и попросить привести документацию к видимому виду."
    clarification: "В документации обнаружен текст, не видимый при просмотре ({quote}). Просим разъяснить, является ли он частью условий закупки, и разместить документацию в виде, при котором весь текст видим."
    legal_basis:
      - {act: "44-ФЗ", ref: "ч. 2 ст. 8", note: "запрет действий, ограничивающих конкуренцию", edition_checked: "2026-10-03"}
    status: draft

  - id: CON-05
    title: Текст, обращённый к программам проверки
    category: consistency
    law: ["44-ФЗ", "223-ФЗ"]
    applies_to: [notice, contract, spec, bid_requirements, nmck, other]
    type: signal
    signal: ai_instructions
    severity: yellow
    message: "Документ обращается к программам автоматической проверки: {quote}"
    why_risk: "Юридический документ не даёт указаний нейросетям. Такой текст — попытка повлиять на автоматический анализ («нарушений нет», «ответь ok»), чтобы рискованные условия не были замечены. Выводы модели «в порядке» по этому документу система не использует."
    recommendation: "Прочитать документ целиком самостоятельно — прежде всего ответственность, сроки оплаты и основания для расторжения. При сомнениях — запрос на разъяснение."
    legal_basis:
      - {act: "44-ФЗ", ref: "ч. 2 ст. 8", note: "запрет действий, ограничивающих конкуренцию", edition_checked: "2026-10-03"}
    status: draft

  - id: CON-04
    title: Обеспечение исполнения в извещении и в проекте контракта различается
    category: consistency
    law: ["44-ФЗ"]
    applies_to: [notice, contract]
    type: cross_document
    fact: contract_security_percent
    compare: [notice, contract]
    severity: red
    message: "Размер обеспечения исполнения в извещении ({notice}) не совпадает с проектом контракта ({contract})."
    why_risk: "Неясно, какое обеспечение вносить: внесёте меньше — признают уклонившимся от заключения контракта, больше — замороженные деньги и лишняя стоимость гарантии."
    recommendation: "Направить запрос на разъяснение до подачи заявки и уточнить размер обеспечения."
    clarification: "Размер обеспечения исполнения контракта в извещении и в проекте контракта различается. Просим указать верный размер и внести изменения в документацию."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 96", note: "размер обеспечения указывается в извещении", edition_checked: "2026-10-03"}
    status: draft

  - id: CON-02
    title: Количество в ТЗ и в проекте контракта различается
    category: consistency
    law: ["44-ФЗ", "223-ФЗ"]
    applies_to: [spec, contract]
    type: cross_document
    fact: quantity_total
    compare: [spec, contract]
    severity: red
    message: "Количество товара в ТЗ ({spec}) не совпадает с проектом контракта ({contract})."
    why_risk: "Неясно, сколько поставлять; ошибка в объёме ведёт к недопоставке или неоплате."
    recommendation: "Направить запрос на разъяснение положений документации."
    legal_basis: []
    status: draft

  - id: CON-06
    title: Срок поставки противоречит сроку исполнения контракта
    category: consistency
    law: ["44-ФЗ"]
    applies_to: [notice, contract, spec]
    type: llm_check
    group: delivery
    # разные сроки поставки в разных документах ловит CON-01 (программно, по карточке закупки);
    # здесь — только поставка позже срока исполнения контракта, иначе один риск давал два
    # замечания, причём модель отмечала второе то так, то нет (демо, 20.10.2026)
    question: >
      Не разрешена ли поставка (выполнение) позже, чем контракт должен быть исполнен или
      перестаёт действовать? Разные сроки поставки в разных документах здесь не учитывай —
      их проверяет отдельное правило.
    violation_if: >
      поставка разрешена позже окончания срока исполнения или действия контракта (например,
      исполнение — до 1 октября, а поставка — до 15 октября)
    ok_if: "срок поставки укладывается в срок исполнения или действия контракта"
    search_hints: ["срок исполнения контракта", "срок поставки", "срок действия контракта", "действует до", "по", "не позднее"]
    absent_behavior: ignore
    severity: yellow
    message: "Срок поставки не согласован со сроком исполнения контракта."
    why_risk: "Неясно, к какой дате исполнять обязательства: просрочку могут считать от более ранней даты — пеня и риск одностороннего отказа."
    recommendation: "Запросить разъяснение, какая дата окончательная, до окончания подачи заявок."
    legal_basis:
      - {act: "Обзор практики ФАС России по 44-ФЗ", ref: "май 2026", note: "противоречие между сроком исполнения контракта и сроком поставки признано нарушением", edition_checked: "2026-10-07"}
    status: draft

  # ═════════════════════ 223-ФЗ: собственные нормы ═════════════════════
  # Правила с нормами 44-ФЗ к договорам по 223-ФЗ не применяются (положение о закупке, ГК РФ);
  # общие риски помечены обоими законами выше. Сверено по открытым источникам 2026-10-08.

  - id: PAY-21
    title: "223-ФЗ: срок оплаты дольше 7 рабочих дней"
    category: payment
    law: ["223-ФЗ"]
    applies_to: [contract]
    type: threshold
    fact: payment_term_working_days
    conditions:
      - {when: "value > 30", severity: red}
      - {when: "value > 7", severity: yellow}
    on_missing:
      severity: yellow
      message: "Срок оплаты в проекте договора не найден числом — проверьте условия оплаты вручную."
    message: "Оплата через {value} раб. дн. после приёмки — дольше 7 раб. дн."
    why_risk: >
      Для договоров с малым и средним бизнесом срок оплаты — не более 7 рабочих дней с приёмки,
      и положение о закупке его не продлевает; в остальных случаях больший срок допустим, только
      если он обоснован положением о закупке. Длинная отсрочка — кассовый разрыв поставщика.
    recommendation: >
      Если вы субъект МСП — запросить разъяснение со ссылкой на ПП РФ № 1352; иначе проверить
      положение о закупке заказчика и заложить стоимость отсрочки в цену.
    legal_basis:
      - {act: "223-ФЗ", ref: "ч. 5.3 ст. 3", note: "срок оплаты — не более 7 рабочих дней с приёмки, если иное не установлено", edition_checked: "2026-10-08"}
      - {act: "ПП РФ № 1352 от 11.12.2014", ref: "п. 14(3), п. 28", note: "для договоров с МСП — не более 7 рабочих дней", edition_checked: "2026-10-08"}
    status: draft

  - id: SEC-21
    title: "223-ФЗ: обеспечение исполнения больше 5%"
    category: security
    law: ["223-ФЗ"]
    applies_to: [notice, contract]
    type: threshold
    fact: contract_security_percent
    conditions:
      - {when: "value > 5", severity: yellow}
    message: "Обеспечение исполнения договора — {value}% цены."
    why_risk: >
      Деньги или гарантия заморожены на весь срок договора. В закупке среди МСП без аванса
      обеспечение больше 5% цены незаконно; при авансе — не больше его размера.
    recommendation: >
      Проверить, проводится ли закупка среди МСП; если да — запросить разъяснение со ссылкой на
      п. 25 ПП РФ № 1352. Заложить стоимость гарантии в цену.
    legal_basis:
      - {act: "ПП РФ № 1352 от 11.12.2014", ref: "п. 25", note: "для МСП без аванса — не более 5% НМЦД; при авансе — в размере аванса", edition_checked: "2026-10-08"}
    status: draft

  - id: ACC-21
    title: "223-ФЗ: длинный срок приёмки"
    category: acceptance
    law: ["223-ФЗ"]
    applies_to: [contract]
    type: threshold
    fact: acceptance_term_working_days
    conditions:
      - {when: "value > 15", severity: yellow}
    message: "Приёмка — до {value} раб. дн."
    why_risk: >
      Срок оплаты отсчитывается от подписания документа о приёмке: долгая приёмка отодвигает
      оплату, даже если сам срок оплаты короткий.
    recommendation: "Запросить разъяснение: в какой срок заказчик подписывает документ о приёмке или мотивированный отказ."
    legal_basis:
      - {act: "223-ФЗ", ref: "ч. 5.3 ст. 3", note: "срок оплаты считается со дня подписания документа о приёмке", edition_checked: "2026-10-08"}
    status: draft

  - id: TRM-21
    title: "223-ФЗ: односторонний отказ заказчика без возмещения расходов"
    category: termination
    law: ["223-ФЗ"]
    applies_to: [contract]
    type: llm_check
    group: termination
    question: >
      Может ли заказчик отказаться от договора в одностороннем порядке без нарушения со стороны
      поставщика, и возмещаются ли тогда поставщику понесённые расходы?
    violation_if: >
      заказчик вправе отказаться от договора в любое время или по своему усмотрению, и при этом
      не сказано о возмещении поставщику фактически понесённых расходов
    ok_if: "односторонний отказ — только при существенном нарушении поставщиком или с оплатой понесённых расходов"
    search_hints: ["односторонний отказ", "отказаться от исполнения", "в любое время", "расторгнуть", "по своему усмотрению", "понесенные расходы"]
    absent_behavior: ignore
    severity: yellow
    message: "Заказчик вправе отказаться от договора без нарушения поставщика и без возмещения расходов."
    why_risk: "Заказчик может прекратить договор после того, как поставщик закупил товар, — без оплаты расходов."
    recommendation: "Запросить разъяснение или изменение: при отказе без нарушения — возмещение фактически понесённых расходов."
    legal_basis:
      - {act: "ГК РФ", ref: "ст. 450.1, 782", note: "односторонний отказ — с возмещением фактически понесённых расходов", edition_checked: "2026-10-08"}
    status: draft

  - id: LIA-21
    title: "223-ФЗ: неустойка поставщика без предела, у заказчика — нет"
    category: liability
    law: ["223-ФЗ"]
    applies_to: [contract]
    type: llm_check
    group: liability
    question: >
      Ограничен ли общий размер неустойки поставщика и отвечает ли заказчик за просрочку оплаты?
    violation_if: >
      неустойка поставщика без верхнего предела (например, 0,1% в день без ограничения общей
      суммы), а ответственность заказчика за просрочку оплаты не установлена или несоизмеримо
      меньше
    ok_if: "общий размер неустойки ограничен или ответственность сторон сопоставима"
    search_hints: ["неустойка", "пеня", "штраф", "за каждый день просрочки", "не более", "ответственность заказчика", "просрочки оплаты"]
    absent_behavior: ignore
    severity: yellow
    message: "Неустойка поставщика не ограничена, а заказчик за просрочку оплаты не отвечает."
    why_risk: "Без предела неустойка может превысить прибыль по договору, а просрочку оплаты заказчиком компенсировать нечем."
    recommendation: "Предложить предел неустойки (например, 10% цены) и взаимную ответственность за просрочку оплаты; в споре — ст. 333 ГК РФ."
    legal_basis:
      - {act: "ГК РФ", ref: "ст. 330, 333", note: "неустойка по договору; суд снижает явно несоразмерную", edition_checked: "2026-10-08"}
    status: draft
