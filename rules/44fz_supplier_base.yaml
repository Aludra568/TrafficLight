    message: "При подписании контракта нужно успеть выполнить дополнительные требования."
    why_risk: "Не успели в срок — признание уклонившимся, штраф и включение в РНП."
    recommendation: "Подготовить обеспечение и документы до окончания торгов."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 51", note: "подписание победителем в течение 5 рабочих дней", edition_checked: "2026-10-02"}
      - {act: "44-ФЗ", ref: "ст. 104", edition_checked: "2026-10-02"}
    status: draft

  # ───────────────────────── Сроки и объём ─────────────────────────
