# Набор правил «44-ФЗ: риски поставщика (базовый)»
# ВСЕ правила в статусе draft до проверки человеком с юридической подготовкой.
# Нормы сверены по открытым источникам на 2026-10-02; редакции обязательно перепроверить перед статусом verified.

ruleset:
  code: 44fz-supplier-base
  title: "44-ФЗ: риски поставщика (базовый)"
  law: "44-ФЗ"
  version: 1

rules:

  # ───────────────────────── Оплата ─────────────────────────
  - id: PAY-01
    title: Срок оплаты дольше 7 рабочих дней
    category: payment
    law: ["44-ФЗ"]
    applies_to: [contract]
    type: threshold
    fact: payment_term_working_days
    conditions:
      - {when: "value > 30", severity: red}
      - {when: "value > 7", severity: yellow}
    # срок оплаты в контракте обязателен (ч. 13.1 ст. 34): не нашли числом — не «рисков нет»,
    # а повод посмотреть самому (опечатка, ошибка распознавания, ссылка на закон)
    on_missing:
      severity: yellow
      message: "Срок оплаты в проекте контракта не найден числом — проверьте условия оплаты вручную."
    message: "Оплата через {value} раб. дн. после приёмки — дольше 7 раб. дн."
    why_risk: >
      Оборотные средства замораживаются дольше, чем предусмотрено законом. При кассовом разрыве
      растёт риск сорвать следующие поставки и получить неустойку.
    recommendation: >
      Направить запрос на разъяснение положений документации со ссылкой на ч. 13.1 ст. 34 44-ФЗ.
      Если условие останется — заложить стоимость отсрочки в цену.
    legal_basis:
      - {act: "44-ФЗ", ref: "ч. 13.1 ст. 34", note: "оплата не более 7 рабочих дней с даты подписания документа о приёмке", edition_checked: "2026-10-02"}
    status: draft

  - id: PAY-02
    title: Аванс не предусмотрен
    category: payment
    law: ["44-ФЗ", "223-ФЗ"]
    applies_to: [contract]
    type: threshold
    fact: advance_percent
    conditions:
      - {when: "value == 0", severity: yellow}
    message: "Аванс не предусмотрен: поставку придётся финансировать из собственных средств."
    why_risk: "Нужны оборотные средства на весь объём до оплаты. Для крупного контракта это кредит и его стоимость."
    recommendation: "Посчитать потребность в оборотных средствах и стоимость кредита, заложить в цену."
    legal_basis: []
    status: draft

  - id: PAY-03
    title: Казначейское сопровождение контракта
    category: payment
    law: ["44-ФЗ", "223-ФЗ"]
    applies_to: [notice, contract]
    type: pattern
    patterns:
      - "(?i)казначейск\\w*\\s+сопровожд"
    # «казначейскому сопровождению не подлежит» — оговорка, а не условие
    exclude_patterns:
      # «Информация о казначейском сопровождении: Не установлено» — поле печатной формы ЕИС
      - "(?i)казначейск\\w*\\s+сопровожд\\w*[^.;]{0,40}?не\\s+(?:подлежит|осуществляется|применяется|требуется|предусмотрен|установлен)"
      - "(?i)не\\s+(?:подлежит|подлежат|осуществляется|применяется)[^.;]{0,40}?казначейск\\w*\\s+сопровожд"
      # «(если … расчеты в части аванса подлежат казначейскому сопровождению)» — типовая оговорка ст. 96
      - "(?i)если[^.;]{0,200}?подлеж\\w*\\s+казначейск\\w*\\s+сопровожд"
    scope: chunk
    severity: yellow
    message: "Контракт исполняется с казначейским сопровождением: {quote}"
    why_risk: >
      Аванс и оплата проходят через лицевой счёт в казначействе: на расчётный счёт деньги
      уходят только после документов заказчика, каждая операция проверяется, тратить можно
      только на этот контракт по смете, возврат аванса — по процедуре казначейства. Платежи
      задерживаются, на подготовку документов уходит время.
    recommendation: >
      Заранее открыть лицевой счёт в казначействе, заложить время на санкционирование платежей,
      согласовать с заказчиком график передачи документов о приёмке в казначейство.
    legal_basis:
      - {act: "БК РФ", ref: "гл. 24.2", note: "казначейское сопровождение средств по контрактам", edition_checked: "2026-10-08"}
      - {act: "Приказ Казначейства России № 14н от 22.06.2026", note: "закрытие лицевых счетов и возврат аванса — с 01.09.2026", edition_checked: "2026-10-08"}
    status: draft

  # ───────────────────────── Приёмка ─────────────────────────
  - id: ACC-01
    title: Срок приёмки дольше 20 рабочих дней
    category: acceptance
    law: ["44-ФЗ"]
    applies_to: [contract]
    type: threshold
    fact: acceptance_term_working_days
    conditions:
      - {when: "value > 20", severity: red}
    # срок приёмки — обязательное условие (ст. 94): не нашли числом — не «рисков нет»
    on_missing:
      severity: yellow
      message: "Срок приёмки в проекте контракта не найден числом — проверьте условия приёмки вручную."
    message: "Срок приёмки {value} раб. дн. — больше 20 раб. дн., установленных законом."
    why_risk: "Оплата отодвигается вместе с приёмкой. Условие противоречит закону."
    recommendation: "Направить запрос на разъяснение со ссылкой на ст. 94 44-ФЗ."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 94", note: "приёмка не позднее 20 рабочих дней после поступления документа о приёмке", edition_checked: "2026-10-02"}
    status: draft

  - id: ACC-02
    title: Экспертиза за счёт поставщика или размытые критерии приёмки
    category: acceptance
    law: ["44-ФЗ"]
    applies_to: [contract, spec]
    type: llm_check
    group: acceptance
    question: >
      Возлагает ли документ расходы на экспертизу или испытания на поставщика, или задаёт
      критерии приёмки, которые нельзя объективно проверить?
    violation_if: "экспертиза или испытания за счёт поставщика; критерии вроде «по усмотрению заказчика», «надлежащее качество» без показателей"
    ok_if: "экспертиза за счёт заказчика или проводится его силами; критерии приёмки измеримы"
    search_hints: ["приёмка", "экспертиза", "испытания", "за счёт поставщика", "мотивированный отказ"]
    absent_behavior: ignore
    severity: yellow
    message: "Условия приёмки обременительны или неоднозначны."
    why_risk: "Заказчик может затягивать приёмку или отказывать в ней, а это задержка оплаты и споры."
    recommendation: "Уточнить критерии приёмки и порядок экспертизы запросом на разъяснение."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 94", edition_checked: "2026-10-02"}
    status: draft

  # ───────────────────────── Обеспечение ─────────────────────────
  - id: SEC-01
    title: Обеспечение исполнения больше 30% НМЦК
    category: security
    law: ["44-ФЗ"]
    applies_to: [notice, contract]
    type: threshold
    fact: contract_security_percent
    conditions:
      - {when: "value > 30", severity: red}
    message: "Обеспечение исполнения {value}% — больше 30%. Это допустимо только при авансе больше 30%."
    why_risk: "Крупная сумма заморожена на весь срок контракта. Если аванса нет — условие противоречит закону."
    recommendation: "Проверить размер аванса. Если он меньше обеспечения — направить запрос со ссылкой на ст. 96 44-ФЗ."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 96", note: "0,5–30% НМЦК; при НМЦК > 50 млн — 10–30%; не менее размера аванса", edition_checked: "2026-10-02"}
    status: draft

  - id: SEC-02
    title: Высокое обеспечение исполнения контракта
    category: security
    law: ["44-ФЗ"]
    applies_to: [notice, contract]
    type: threshold
    fact: contract_security_percent
    conditions:
      - {when: "value >= 10 and value <= 30", severity: yellow}
    message: "Обеспечение исполнения {value}% НМЦК."
    why_risk: "Нужна банковская гарантия или деньги на значимую сумму; стоимость гарантии уменьшает маржу."
    recommendation: "Заранее запросить стоимость независимой гарантии и учесть её в цене."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 96", edition_checked: "2026-10-02"}
    status: draft

  - id: SEC-03
    title: Антидемпинговые меры при снижении цены
    category: security
    law: ["44-ФЗ"]
    applies_to: [notice, contract]
    type: llm_check
    group: security
    question: "Говорится ли в документации об антидемпинговых мерах (повышенное обеспечение при снижении цены на 25% и более)?"
    violation_if: "упомянуты антидемпинговые меры или ст. 37 44-ФЗ"
    ok_if: "упоминаний нет"
    search_hints: ["антидемпинговые меры", "статья 37", "снижение цены на двадцать пять", "в полтора раза"]
    absent_behavior: ignore
    severity: yellow
    message: "При снижении цены на 25% и более потребуется увеличенное обеспечение."
    why_risk: "Агрессивное снижение цены на торгах обернётся крупной суммой обеспечения при подписании; не успеть его предоставить — уклонение и РНП."
    recommendation: "Перед торгами посчитать порог снижения цены и наличие средств или гарантии на увеличенное обеспечение."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 37", edition_checked: "2026-10-02"}
    status: draft

  - id: SEC-04
    title: Требуется обеспечение гарантийных обязательств
    category: warranty
    law: ["44-ФЗ"]
    applies_to: [notice, contract]
    type: threshold
    fact: warranty_security_percent
    conditions:
      - {when: "value > 0", severity: yellow}
    message: "Требуется обеспечение гарантийных обязательств ({value}%)."
    why_risk: "Дополнительные деньги или гарантия на весь гарантийный срок после исполнения контракта."
    recommendation: "Учесть стоимость гарантии на гарантийный период в цене."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 96", edition_checked: "2026-10-02"}
    status: draft

  # ───────────────────────── Ответственность ─────────────────────────
  - id: SEC-05
    title: Устаревшая формулировка «банковская гарантия»
    category: security
    law: ["44-ФЗ"]
    applies_to: [notice, contract]
    type: pattern
    patterns:
      - "(?i)банковск\\w*\\s+гаранти"
    # «независимая (банковская) гарантия» — формулировка актуальная, не замечание
    exclude_patterns:
      - "(?i)независим\\w*\\s+(?:\\(\\s*банковск\\w*\\s*\\)\\s+)?гаранти"
    scope: chunk
    severity: yellow
    message: "В документации используется устаревший термин «банковская гарантия»: {quote}"
    why_risk: "С 2022 года 44-ФЗ говорит о независимой гарантии, в том числе выданной не банком. Устаревшая формулировка оставляет неясным, какую гарантию примут: если заказчик отклонит гарантию, поставщика могут признать уклонившимся от заключения контракта."
    recommendation: "Направить запрос на разъяснение: какие независимые гарантии принимаются как обеспечение. Гарантию оформлять по требованиям ст. 45 44-ФЗ."
    clarification: "В документации обеспечение указано как «банковская гарантия» ({quote}). Просим разъяснить, принимается ли независимая гарантия в соответствии со статьёй 45 Закона № 44-ФЗ, и привести формулировку в соответствие с законом."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 45", note: "независимая гарантия — с 01.01.2022", edition_checked: "2026-10-03"}
    status: draft

  - id: LIA-01
    title: Штрафы поставщика выше размеров по ПП № 1042
    category: liability
    law: ["44-ФЗ"]
    applies_to: [contract]
    type: llm_check
    group: liability
    question: >
      Какие размеры штрафов за неисполнение или ненадлежащее исполнение обязательств поставщиком
      установлены в проекте контракта? Сравни с таблицей ниже с учётом цены контракта.
    params:
      # ПП № 1042, штраф для поставщика в зависимости от цены контракта. ТАБЛИЦУ ПРОВЕРИТЬ ЮРИСТУ по актуальной редакции.
      penalty_table:
        - {max_price_rub: 3000000, percent: 10}
        - {max_price_rub: 50000000, percent: 5}
        - {max_price_rub: 100000000, percent: 1}
        - {max_price_rub: 500000000, percent: 0.5}
      note: "для контрактов с СМП и СОНКО действуют отдельные (пониженные) размеры — проверить"
    violation_if: "штраф в контракте выше значения из таблицы для этой цены контракта"
    ok_if: "штраф равен значению из таблицы или ниже"
    search_hints: ["штраф", "неисполнение или ненадлежащее исполнение", "постановление 1042", "процентов цены контракта"]
    # условие о штрафах в контракте обязательно (ч. 4, 8 ст. 34): «не найдено» — не «в порядке»
    absent_behavior: report
    absent_severity: yellow
    absent_message: "Условие о штрафах для поставщика в проекте контракта не найдено, хотя по ч. 8 ст. 34 оно обязательно — проверьте вручную."
    severity: red
    message: "Штраф для поставщика выше установленного ПП № 1042."
    why_risk: "Завышенный штраф прямо увеличивает финансовый риск при любом нарушении."
    recommendation: "Направить запрос на разъяснение со ссылкой на ПП № 1042."
    legal_basis:
      - {act: "ПП РФ № 1042 от 30.08.2017", ref: "п. 3", edition_checked: "2026-10-02"}
    status: draft

  - id: LIA-02
    title: Нет ответственности заказчика
    category: liability
    law: ["44-ФЗ"]
    applies_to: [contract]
    type: llm_check
    group: liability
    question: "Предусмотрена ли в проекте контракта ответственность заказчика (пеня за просрочку оплаты, штраф)?"
    violation_if: "ответственность установлена только для поставщика"
    ok_if: "есть пеня или штраф для заказчика"
    search_hints: ["ответственность заказчика", "просрочки исполнения заказчиком", "пеня начисляется", "ответственность сторон"]
    # модель не может «простить» явное освобождение заказчика от ответственности
    red_flags:
      - '(?i)заказчик\w*\s+(?:не\s+нес[её]т|освобождается\s+от)\s+ответственност'
    absent_behavior: report
    absent_severity: red
    absent_message: "Ответственность заказчика в проекте контракта не найдена."
    severity: red
    message: "Ответственность установлена только для поставщика."
    why_risk: "При просрочке оплаты поставщику будет сложнее получить компенсацию; условие противоречит закону."
    recommendation: "Направить запрос на разъяснение со ссылкой на ст. 34 44-ФЗ."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 34", edition_checked: "2026-10-02"}
    status: draft

  - id: LIA-03
    title: Пеня для поставщика выше 1/300 ключевой ставки
    category: liability
    law: ["44-ФЗ"]
    applies_to: [contract]
    type: llm_check
    group: liability
    question: "Каков размер пени для поставщика за каждый день просрочки?"
    violation_if: "пеня больше одной трёхсотой ключевой ставки ЦБ или выражена фиксированным процентом в день (например, 0,1% в день)"
    ok_if: "пеня — 1/300 ключевой ставки ЦБ от неисполненной части"
    search_hints: ["пеня", "одной трехсотой", "1/300", "ключевой ставки", "за каждый день просрочки"]
    red_flags:
      # пеня долей цены (кроме 1/300) или процентом за каждый день — явный признак завышения
      - '(?i)пен[еияю]\w*[^.;]{0,120}?(?:1\s*/\s*(?:[1-9]\d?|[12]\d\d)(?!\d)|\d+(?:[.,]\d+)?\s*(?:%|процент\w*))[^.;]{0,80}?за\s+каждый\s+день'
    # условие о пене обязательно (ч. 4, 7 ст. 34): «не найдено» — не «в порядке»
    absent_behavior: report
    absent_severity: yellow
    absent_message: "Условие о пене за просрочку в проекте контракта не найдено, хотя по ч. 7 ст. 34 оно обязательно — проверьте вручную."
    severity: red
    message: "Пеня для поставщика выше установленной законом."
    why_risk: "Каждый день просрочки обходится дороже, чем предусмотрено законом."
    recommendation: "Направить запрос на разъяснение со ссылкой на ПП № 1042."
    legal_basis:
      - {act: "ПП РФ № 1042 от 30.08.2017", edition_checked: "2026-10-02"}
    status: draft

  # ───────────────────────── Расторжение ─────────────────────────
  - id: TRM-01
    title: Широкие основания одностороннего отказа заказчика
    category: termination
    law: ["44-ФЗ"]
    applies_to: [contract]
    type: llm_check
    group: termination
    question: >
      Даёт ли проект контракта заказчику право на односторонний отказ от исполнения контракта
      по основаниям шире существенного нарушения (например, «по любым основаниям», за единичную просрочку)?
    violation_if: "основания размыты, шире закона или включают малозначительные нарушения"
    ok_if: "односторонний отказ — по основаниям ст. 95 44-ФЗ и ГК РФ (существенное нарушение)"
    search_hints: ["односторонний отказ", "расторжение контракта", "решение об одностороннем отказе", "существенное нарушение"]
    red_flags:
      # «Заказчик вправе отказаться … по любым основаниям» (но не «не вправе» и не право поставщика)
      - '(?i)заказчик\w*[^.;]{0,60}?(?<!не\s)вправе\s+(?:в\s+одностороннем\s+порядке\s+)?(?:отказаться|расторгнуть)[^.;]{0,200}?(?:по\s+любым\s+основаниям|без\s+объяснения\s+причин|без\s+указания\s+причин|в\s+любое\s+время)'
    absent_behavior: ignore
    severity: red
    message: "Заказчик может легко расторгнуть контракт в одностороннем порядке."
    why_risk: "Односторонний отказ заказчика из-за нарушения поставщиком ведёт к включению в РНП на 2 года."
    recommendation: "Направить запрос на разъяснение; при исполнении документировать каждое действие и отвечать на претензии в срок."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 95", edition_checked: "2026-10-02"}
      - {act: "44-ФЗ", ref: "ст. 104", note: "основания включения в РНП", edition_checked: "2026-10-02"}
    status: draft

  - id: TRM-02
    title: Короткий срок на устранение нарушений после решения об одностороннем отказе
    category: termination
    law: ["44-ФЗ"]
    applies_to: [contract]
    type: llm_check
    group: termination
    question: "Какой срок даётся поставщику на устранение нарушения после решения заказчика об одностороннем отказе, чтобы решение было отменено?"
    violation_if: "срок меньше 10 дней или возможность устранения нарушения исключена"
