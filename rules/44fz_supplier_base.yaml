    search_hints: ["устранено нарушение", "отменить не вступившее в силу решение", "десять дней", "вступает в силу"]
    absent_behavior: ignore
    severity: red
    message: "Поставщику оставлено меньше времени на исправление, чем даёт закон."
    why_risk: "Нет времени устранить нарушение — решение вступает в силу, а это путь в РНП."
    recommendation: "Направить запрос на разъяснение со ссылкой на ст. 95 44-ФЗ."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 95", edition_checked: "2026-10-02"}
    status: draft

