  # ───────────────────────── Предмет закупки ─────────────────────────
  - id: SUB-01
    title: Товарный знак без «или эквивалент»
    category: subject
    law: ["44-ФЗ"]
    applies_to: [spec]
    type: llm_check
    group: subject
    question: >
      Указаны ли в описании объекта закупки товарные знаки, модели или производители без слов
      «или эквивалент», или требуются только оригинальные расходные материалы и запчасти
      производителя?
    violation_if: >
      товарный знак или конкретная модель указаны без «или эквивалент» и без обоснования
      совместимости; требуются только оригинальные расходные материалы (картриджи, запчасти)
      без обоснования — например, для техники, на которую не распространяется гарантия
    ok_if: "товарных знаков нет или указано «или эквивалент»; требование оригинальных расходных материалов обосновано гарантией на это оборудование"
    search_hints: ["товарный знак", "или эквивалент", "производитель", "модель", "марка", "оригинальн", "расходные материалы", "картридж"]
    absent_behavior: ignore
    severity: yellow
    message: "В описании товара указан конкретный товарный знак без эквивалента."
    why_risk: "Поставка эквивалента может быть не принята; заявку с другим товаром могут отклонить."
    recommendation: "Уточнить допустимость эквивалента запросом на разъяснение; при необходимости — жалоба до окончания подачи заявок."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 33", edition_checked: "2026-10-02"}
      - {act: "Обзор практики ФАС России по 44-ФЗ", ref: "май 2026", note: "требование только оригинальных картриджей для техники вне гарантии признано незаконным", edition_checked: "2026-10-07"}
    status: draft

  - id: SUB-02
    title: Действует запрет или ограничение по нацрежиму
    category: national_regime
    law: ["44-ФЗ"]
    applies_to: [notice, spec]
    type: threshold
    fact: national_regime
    conditions:
      - {when: "value == 'ban'", severity: yellow}
      - {when: "value == 'restriction'", severity: yellow}
    message: "Установлен {value} по нацрежиму (ПП № 1875)."
    why_risk: "Заявку с иностранным товаром отклонят, а при поставке нужно подтвердить происхождение товара."
    recommendation: "Проверить, есть ли товар в реестре российской продукции, и подготовить подтверждающие документы."
    legal_basis:
      - {act: "ПП РФ № 1875 от 23.12.2024", edition_checked: "2026-10-02", note: "перечни меняются; в 2026 — поправки июля, новые меры с 01.01.2027"}
    status: draft

  - id: SUB-03
    title: Русские буквы в словах заменены латинскими
    category: subject
    law: ["44-ФЗ", "223-ФЗ"]
    applies_to: [notice, contract, spec]
    type: pattern
    # слово из 4+ букв, где есть и кириллица, и латиница («пoставка» с латинской «o»), кроме
    # единиц вроде «kВт»; ищется по исходному тексту — при нормализации буквы сворачиваются
    patterns:
      - "(?<![A-Za-zА-Яа-яЁё])(?![kK](?:Вт|ВА|вар|Гц|Па|В)(?:ч|·ч)?(?![А-Яа-яЁё]))(?=[A-Za-zА-Яа-яЁё]*[А-Яа-яЁё])(?=[A-Za-zА-Яа-яЁё]*[A-Za-z])[A-Za-zА-Яа-яЁё]{4,}"
    exclude_patterns: []
    scope: chunk
    severity: yellow
    message: "В тексте есть слова, где русские буквы заменены похожими латинскими: {quote}"
    why_risk: "По такому тексту закупку не найти поиском по ключевым словам, поэтому участников меньше. Если подмена в наименовании объекта закупки, ФАС рассматривает её как ограничение конкуренции. Подменённые слова могут скрывать и условия контракта от автоматической проверки."
    recommendation: "Проверить, находится ли закупка поиском в ЕИС по ключевым словам. Если подмена в наименовании или описании объекта — направить запрос на разъяснение или жалобу в ФАС."
    clarification: "В тексте документации слова набраны со смешением русских и латинских букв ({quote}). Просим привести текст к единому написанию, чтобы закупка находилась поиском по ключевым словам."
    legal_basis:
      - {act: "44-ФЗ", ref: "ч. 2 ст. 8", note: "запрет действий, ограничивающих конкуренцию", edition_checked: "2026-10-03"}
      - {act: "44-ФЗ", ref: "п. 1 ч. 1 ст. 33", note: "описание объекта закупки носит объективный характер", edition_checked: "2026-10-03"}
    status: draft

  - id: REQ-01
    title: Специальные требования к участнику
    category: requirements
    law: ["44-ФЗ"]
    applies_to: [notice, bid_requirements]
    type: llm_check
    group: requirements
    question: "Есть ли требования к участнику: лицензии, членство в СРО, опыт исполнения контрактов, допуски?"
    violation_if: "есть любые такие требования"
    ok_if: "только общие требования"
    search_hints: ["лицензия", "СРО", "опыт исполнения", "дополнительные требования", "статьи 31"]
    absent_behavior: ignore
    severity: yellow
    message: "К участнику предъявляются специальные требования."
    why_risk: "Без подтверждающих документов заявку отклонят."
    recommendation: "Проверить наличие лицензий, членства в СРО и подтверждения опыта до подачи заявки."
    legal_basis:
      - {act: "44-ФЗ", ref: "ст. 31", edition_checked: "2026-10-02"}
    status: draft

  - id: REQ-02
    title: Обязанности поставщика, которые зависят от третьих лиц
    category: requirements
    law: ["44-ФЗ", "223-ФЗ"]
    applies_to: [contract, spec]
    type: llm_check
    group: requirements
    question: >
      Возлагает ли документ на поставщика обязанности, выполнение которых зависит не от него,
      а от третьих лиц: производителя, регулятора, банка, перевозчика, других подрядчиков
      заказчика?
    violation_if: >
      поставщик обязан обеспечить или своевременно сообщать то, что от него не зависит:
      например, уведомлять об изменении регистрационного удостоверения, которое меняет
      производитель, или получить документы, которые выдаёт другой орган, к сроку без
      оговорки об ответственности при задержке по их вине
    ok_if: "обязанности поставщика зависят только от него; для действий третьих лиц есть оговорка или сроки считаются с их ответа; передать с товаром копии имеющихся сертификатов, деклараций соответствия, паспортов и удостоверений качества — обычное условие поставки"
    search_hints: ["третьих лиц", "производитель", "регистрационное удостоверение", "уведомлять", "обеспечить получение", "согласование с"]
    absent_behavior: ignore
    severity: yellow
    message: "На поставщика возложены обязанности, исполнение которых зависит от третьих лиц."
    why_risk: "Поставщик может не исполнить их не по своей вине, а штрафы и односторонний отказ лягут на него."
    recommendation: "Запросить разъяснение или изменение условия: ответственность — только за свои действия, сроки — с момента ответа третьего лица."
    legal_basis:
      - {act: "Обзор практики ФАС России по 44-ФЗ", ref: "май 2026", note: "возложение на поставщика обязанностей, зависящих от третьих лиц, признано нарушением", edition_checked: "2026-10-07"}
      - {act: "223-ФЗ", ref: "ч. 1 ст. 2", note: "избыточные требования к поставщику в проекте договора ФАС признаёт нарушением (практика 2024–2025)", edition_checked: "2026-10-08"}
    status: draft

  - id: REQ-03
    title: Форма первой части заявки требует сведений об участнике
    category: requirements
    law: ["44-ФЗ"]
    applies_to: [notice, bid_requirements]
    type: llm_check
    group: requirements
    question: >
      Требует ли документация или форма первой части заявки (предложения участника по объекту
      закупки) указать наименование, ИНН, адрес, подпись участника или цену?
    violation_if: >
      форма или инструкция первой части заявки требует сведений об участнике (наименование,
      ИНН, подпись, печать) или о цене
    ok_if: "первой части нет (аукцион) или в ней только предложение по объекту закупки и страна происхождения"
    search_hints: ["первая часть заявки", "первой части заявки", "предложение участника", "наименование участника", "форма заявки", "подпись участника"]
    absent_behavior: ignore
    severity: yellow
    message: "Форма первой части заявки требует сведений об участнике или цене."
    why_risk: >
      Первая часть заявки содержит только предложение по объекту закупки: заполнив форму, как
      требует заказчик, можно раскрыть сведения об участнике и получить отклонение заявки.
    recommendation: >
      Сведения об участнике в первую часть не включать; направить запрос на разъяснение формы
      до окончания подачи заявок.
    legal_basis:
      - {act: "44-ФЗ", ref: "подп. «а» п. 2 ч. 1 ст. 43", note: "первая часть — предложение участника в отношении объекта закупки; сверить с действующей редакцией", edition_checked: "2026-10-08"}
    status: draft

