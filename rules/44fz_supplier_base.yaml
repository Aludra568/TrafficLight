    params: {note: "пороги — настраиваемые; по умолчанию для товаров"}
    conditions:
      - {when: "value < 5", severity: red}
      - {when: "value < 10", severity: yellow}
    # срок поставки — существенное условие: не нашли числом — проверить самому
    on_missing:
      severity: yellow
      message: "Срок поставки в документах не найден числом — проверьте его вручную."
    message: "Срок поставки {value} дн. — очень мало для подготовки и доставки."
    why_risk: "Просрочка с первого дня: пени, а при существенной просрочке — односторонний отказ и РНП."
    recommendation: "Проверить наличие товара на складе и логистику до подачи заявки; при необходимости запросить разъяснение."
    legal_basis: []
    status: draft

