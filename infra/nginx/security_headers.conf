# Заголовки безопасности страниц интерфейса.
# Подключаются в каждом location: add_header внутри location отменяет заголовки уровня server.
#
# CSP: скрипты, стили, шрифты и запросы — только с этого же адреса; внешних ресурсов у интерфейса
# нет. 'unsafe-inline' для стилей — Ant Design вставляет стили компонентов в <style> (CSS-in-JS),
# скриптов он не касается. blob: — обработчик PDF и выгрузка отчётов файлом.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
