# nginx перед интерфейсом и API

# Частота запросов к API с одного адреса: интерфейс делает единицы запросов в секунду, отчёт —
# десяток сразу (запас burst). Перебор, сканер или зациклившийся клиент получают 429, а не
# занимают API. Вход и загрузки ограничены ещё и в самом API (по почте и по пользователю)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # версия nginx в ответах и на страницах ошибок — подсказка для подбора известных уязвимостей
    server_tokens off;

    # адрес api — через DNS Docker при каждом запросе (раз в 10 с), а не один раз при старте:
    # пересозданный контейнер api получает новый адрес, и nginx до перезапуска отдавал 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # пакет до MAX_UPLOAD_MB=100 плюс запас на заголовки multipart
    client_max_body_size 110m;
    # медленный клиент (slowloris) не держит соединение дольше 30 с между порциями данных
    client_header_timeout 30s;
    client_body_timeout 30s;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # add_header в location отменяет заголовки уровня server, поэтому они — в каждом location

    location /api/ {
        include /etc/nginx/snippets/api_headers.conf;
        limit_req zone=api burst=100 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # адрес клиента для ограничения попыток входа. nginx — первый узел, поэтому заголовок
        # перезаписывается: дописанный ($proxy_add_x_forwarded_for) клиент подделал бы и обходил
        # лимит. За корпоративным прокси здесь нужен его заголовок (set_real_ip_from)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # загрузка пакета идёт в API потоком, без промежуточного файла nginx
        proxy_request_buffering off;
        # прогресс проверки и выгрузки отчётов: ответ отдаётся сразу, без буфера
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Описание API (Swagger UI): страница FastAPI грузит скрипты и стили с cdn.jsdelivr.net и
    # запускает их встроенным скриптом — свой CSP; само описание (openapi.json) — обычный ответ API
    location = /api/docs {
        add_header Content-Security-Policy "default-src 'none'; script-src https://cdn.jsdelivr.net 'unsafe-inline'; style-src https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        limit_req zone=api burst=100 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ход проверки (Server-Sent Events): поток держится до конца проверки, без буфера
    location ~ ^/api/checks/[^/]+/events$ {
        include /etc/nginx/snippets/api_headers.conf;
        limit_req zone=api burst=100 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Метрики снаружи не отдаём: запросы с хоста через проброшенный порт приходят с адреса шлюза
    # Docker (172.x), то есть «из внутренней сети» — разрешение по адресу пропустило бы всех.
    # Prometheus забирает их напрямую у api:8000/metrics внутри сети контейнеров.
    location /metrics {
        return 404;
    }

    # скрытые файлы (.git, .env и т. п.) в статике не отдаются, даже если попали в сборку
    location ~ /\. {
        return 404;
    }

    # статика Vite с хешами в именах — кэшируется надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security_headers.conf;
        try_files $uri =404;

        # обработчик PDF (react-pdf) — модуль .mjs: в mime.types nginx его нет, файл уходил как
        # application/octet-stream, и с nosniff браузер его не запускал — документ не открывался
        location ~* \.mjs$ {
            types { }
            default_type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/snippets/security_headers.conf;
            try_files $uri =404;
        }
    }

    # маршруты интерфейса (React Router) — на index.html
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security_headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
