[project]
name = "svetofor"
version = "0.1.0"
description = "Светофор рисков закупочной документации (кейс-чемпионат B2B-РТС, задача 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Веб и данные
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # Очереди и кэш
    "celery[redis]>=5.4",
    "redis>=5.0",
    # ИИ
    "httpx>=0.27",
    "openai>=1.50",
    "jinja2>=3.1",
    # Документы
    "pymupdf>=1.24",
    "img2pdf>=0.5",
    "ocrmypdf>=16.0",          # бинарники tesseract/ghostscript — в Docker-образе
    "python-docx>=1.1",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    # Безопасность и наблюдаемость
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "regex>=2024.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "fakeredis>=2.24",
    "respx>=0.21",
    "pgserver>=0.1.4",
    "pymupdf-fonts>=1.0.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["svetofor"]

# ─── Линтер ───
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PTH"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях — норма для проекта
    "S101",                        # assert в тестах
    "S603", "S607",                # вызов внешних программ (soffice, ocrmypdf) — осознанный
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["svetofor"]
known-third-party = ["alembic"]  # рядом лежит папка миграций alembic/ — это не наш пакет

# ─── Типы ───
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["svetofor.rules.*", "svetofor.llm.*", "svetofor.core.*"]
strict = true

# У Celery и prometheus_client.multiprocess нет аннотаций типов: декораторы задач «нетипизированы»
[[tool.mypy.overrides]]
module = ["svetofor.tasks.*"]
disable_error_code = ["untyped-decorator", "no-untyped-call"]

# ─── Тесты ───
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docker: нужны сервисы или бинарники из Docker-образа (PostgreSQL, Redis, Tesseract, LibreOffice)",
    "slow: медленный тест",
    "pg: нужен PostgreSQL (TEST_DATABASE_URL или локальный pgserver)",
]
filterwarnings = ["ignore::DeprecationWarning:pikepdf.*"]
