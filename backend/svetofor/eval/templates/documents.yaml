# Шаблоны документов синтетического пакета.
# Пункты нумеруются генератором; «slot» — место, где вариант формулировки выбирает пакет
# (см. slots.yaml). Подстановки {name} — параметры пакета (packages.yaml).

notice:
  filename: "Извещение о проведении электронного аукциона.docx"
  title: "ИЗВЕЩЕНИЕ ОБ ОСУЩЕСТВЛЕНИИ ЗАКУПКИ"
  subtitle: "путём проведения электронного аукциона"
  sections:
    - title: "Общие сведения о закупке"
      items:
        - "Номер извещения: {number}."
        - "Закупка осуществляется в соответствии с Федеральным законом от 05.04.2013 № 44-ФЗ «О контрактной системе в сфере закупок товаров, работ, услуг для обеспечения государственных и муниципальных нужд»."
        - "Заказчик: {customer}."
        - "Наименование объекта закупки: {subject}."
        - "Начальная (максимальная) цена контракта: {nmck_text} рублей."
    - title: "Порядок подачи заявок"
      items:
        - slot: DEADLINE
        - slot: FIRST_PART
    - title: "Требования к участникам закупки"
      items:
        - "Единые требования к участникам закупки установлены в соответствии с частью 1 статьи 31 Федерального закона № 44-ФЗ."
        - slot: REQ
        - slot: SMP
    - title: "Обеспечение заявки и исполнения контракта"
      items:
        - "Размер обеспечения заявки на участие в закупке составляет 1 процент начальной (максимальной) цены контракта."
        - slot: SECURITY
        - slot: ANTIDUMPING
        - slot: WARRANTY_SECURITY
    - title: "Национальный режим"
      items:
        - slot: NATIONAL
    - title: "Порядок заключения контракта"
      items:
        - "Контракт заключается после подписания его победителем электронного аукциона и заказчиком в единой информационной системе в порядке, установленном статьёй 51 Федерального закона № 44-ФЗ."
        - slot: SIGNING

contract:
  filename: "Проект контракта.docx"
  title: "ПРОЕКТ КОНТРАКТА"
  subtitle: "на поставку товара № ______"
  preamble: >-
    {customer}, именуемое в дальнейшем «Заказчик», в лице директора, действующего на основании
    Устава, с одной стороны, и участник закупки, именуемый в дальнейшем «Поставщик», с другой
    стороны, вместе именуемые «Стороны», в соответствии с Федеральным законом от 05.04.2013
    № 44-ФЗ по результатам электронного аукциона (извещение № {number}) заключили настоящий
    Контракт о нижеследующем.
  sections:
    - title: "ПРЕДМЕТ КОНТРАКТА"
      items:
        - slot: QUANTITY
        - slot: VOLUME
    - title: "ЦЕНА КОНТРАКТА И ПОРЯДОК РАСЧЁТОВ"
      items:
        - "Цена Контракта составляет {price_text} рублей, НДС не облагается, и является твёрдой на весь срок исполнения Контракта."
        - slot: EXTRAS
        - slot: ADVANCE
        - slot: PAYMENT
        - slot: TREASURY
    - title: "СРОКИ И ПОРЯДОК ПОСТАВКИ"
      items:
        - slot: DELIVERY
        - "Место поставки Товара: {place}."
        - slot: THIRD_PARTY
    - title: "ПОРЯДОК ПРИЁМКИ ТОВАРА"
      items:
        - slot: ACCEPTANCE
        - slot: EXPERTISE
    - title: "ГАРАНТИЙНЫЕ ОБЯЗАТЕЛЬСТВА"
      items:
        - "Поставщик гарантирует, что Товар является новым, не бывшим в употреблении, и соответствует требованиям Контракта."
        - slot: WARRANTY
    - title: "ОБЕСПЕЧЕНИЕ ИСПОЛНЕНИЯ КОНТРАКТА"
      items:
        - slot: SECURITY
    - title: "ОТВЕТСТВЕННОСТЬ СТОРОН"
      items:
        - "За неисполнение или ненадлежащее исполнение обязательств, предусмотренных Контрактом, Стороны несут ответственность в соответствии с законодательством Российской Федерации и Контрактом."
        - slot: CUSTOMER_LIABILITY
        - slot: PENALTY
        - slot: FINE
    - title: "РАСТОРЖЕНИЕ КОНТРАКТА"
      items:
        - "Расторжение Контракта допускается по соглашению Сторон, по решению суда или в связи с односторонним отказом Стороны от исполнения Контракта в соответствии с гражданским законодательством."
        - slot: TERMINATION
        - slot: CURE_PERIOD
    - title: "ПРОЧИЕ УСЛОВИЯ"
      items:
        - slot: CONTRACT_TERM
        - "Споры, возникающие из Контракта, разрешаются в Арбитражном суде по месту нахождения Заказчика."
        - slot: HIDDEN

spec:
  filename: "Описание объекта закупки.docx"
  title: "ОПИСАНИЕ ОБЪЕКТА ЗАКУПКИ"
  subtitle: "(техническое задание)"
  sections:
    - title: "Наименование и количество товара"
      items:
        - "Наименование объекта закупки: {subject}."
        - slot: QUANTITY
        - slot: TRADEMARK
    - title: "Требования к качеству и безопасности товара"
      items:
        - "Товар должен быть новым, не бывшим в употреблении, не восстановленным и соответствовать требованиям технических регламентов."
        - "{quality}"
    - title: "Требования к поставке"
      items:
        - slot: DELIVERY
        - "Место поставки: {place}."
    - title: "Требования к упаковке и маркировке"
      items:
        - "Упаковка должна обеспечивать сохранность Товара при транспортировке и хранении."
