# Шаблоны синтетического пакета по 223-ФЗ: запрос котировок, проект договора,
# техническое задание. Нормы 44-ФЗ в тексте не упоминаются — иначе закон пакета не определится.
# Слоты — те же варианты из slots.yaml; свои для 223-ФЗ — с суффиксом _223.

notice:
  filename: "Извещение о проведении запроса котировок.docx"
  title: "ИЗВЕЩЕНИЕ О ПРОВЕДЕНИИ ЗАПРОСА КОТИРОВОК"
  subtitle: "в электронной форме"
  sections:
    - title: "Общие сведения о закупке"
      items:
        - "Номер извещения: {number}."
        - "Закупка осуществляется в соответствии с Федеральным законом от 18.07.2011 № 223-ФЗ «О закупках товаров, работ, услуг отдельными видами юридических лиц» и Положением о закупке Заказчика."
        - "Заказчик: {customer}."
        - "Наименование объекта закупки: {subject}."
        - "Начальная (максимальная) цена договора: {nmck_text} рублей."
    - title: "Порядок подачи заявок"
      items:
        - slot: DEADLINE
    - title: "Обеспечение исполнения договора"
      items:
        - slot: SECURITY_223

contract:
  filename: "Проект договора.docx"
  title: "ПРОЕКТ ДОГОВОРА"
  subtitle: "поставки товара № ______"
  preamble: >-
    {customer}, именуемое в дальнейшем «Заказчик», в лице директора, действующего на основании
    Устава, с одной стороны, и участник закупки, именуемый в дальнейшем «Поставщик», с другой
    стороны, в соответствии с Федеральным законом от 18.07.2011 № 223-ФЗ по результатам запроса
    котировок (извещение № {number}) заключили настоящий Договор о нижеследующем.
  sections:
    - title: "ПРЕДМЕТ ДОГОВОРА"
      items:
        - slot: QUANTITY
    - title: "ЦЕНА ДОГОВОРА И ПОРЯДОК РАСЧЁТОВ"
      items:
        - "Цена Договора составляет {price_text} рублей, НДС не облагается."
        - slot: ADVANCE
        - slot: PAYMENT_223
        - slot: TREASURY
    - title: "СРОКИ И ПОРЯДОК ПОСТАВКИ"
      items:
        - slot: DELIVERY
        - "Место поставки Товара: {place}."
        - slot: THIRD_PARTY
    - title: "ПОРЯДОК ПРИЁМКИ ТОВАРА"
      items:
        - slot: ACCEPTANCE_223
    - title: "ГАРАНТИЙНЫЕ ОБЯЗАТЕЛЬСТВА"
      items:
        - slot: WARRANTY
    - title: "ОБЕСПЕЧЕНИЕ ИСПОЛНЕНИЯ ДОГОВОРА"
      items:
        - slot: SECURITY_223
    - title: "ОТВЕТСТВЕННОСТЬ СТОРОН"
      items:
        - slot: PENALTY_223
    - title: "РАСТОРЖЕНИЕ ДОГОВОРА"
      items:
        - "Договор может быть расторгнут по соглашению Сторон или по решению суда."
        - slot: TERMINATION_223

spec:
  filename: "Техническое задание.docx"
  title: "ТЕХНИЧЕСКОЕ ЗАДАНИЕ"
  subtitle: "на поставку товара"
  sections:
    - title: "Наименование и количество товара"
      items:
        - "Наименование объекта закупки: {subject}."
        - slot: QUANTITY
    - title: "Требования к качеству товара"
      items:
        - "Товар должен быть новым, не бывшим в употреблении."
        - "{quality}"
    - title: "Требования к поставке"
      items:
        - slot: DELIVERY
        - "Место поставки: {place}."
